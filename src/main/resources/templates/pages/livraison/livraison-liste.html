<section class="section" th:fragment="page">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4 class="card-title mb-0">Liste des Livraisons</h4>
        </div>

        <!-- Filter Form -->
        <div class="card-body border-bottom">
            <form method="get" th:action="@{/livraison/liste}" class="row g-3">
                <div class="col-md-4">
                    <label for="filterIdCommande" class="form-label">Commande</label>
                    <select id="filterIdCommande" name="idCommande" class="form-select">
                        <option value="">Toutes les commandes</option>
                        <option th:each="commande : ${commandes}" 
                                th:value="${commande.idCommande}" 
                                th:text="'Commande ' + ${commande.idCommande}"
                                th:selected="${filterIdCommande != null and filterIdCommande == commande.idCommande}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="filterType" class="form-label">Type</label>
                    <select id="filterType" name="type" class="form-select">
                        <option value="">Tous les types</option>
                        <option value="client" th:selected="${filterType == 'client'}">Client</option>
                        <option value="fournisseur" th:selected="${filterType == 'fournisseur'}">Fournisseur</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="filterStartDate" class="form-label">Date Début</label>
                    <input type="datetime-local" id="filterStartDate" name="startDate" class="form-control" 
                           th:value="${filterStartDate}">
                </div>
                <div class="col-md-2">
                    <label for="filterEndDate" class="form-label">Date Fin</label>
                    <input type="datetime-local" id="filterEndDate" name="endDate" class="form-control" 
                           th:value="${filterEndDate}">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Filtrer</button>
                </div>
            </form>
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>
                                <a th:href="@{/livraison/liste(idCommande=${filterIdCommande}, type=${filterType}, startDate=${filterStartDate}, endDate=${filterEndDate}, sortBy='idLivraison', sortDir=${sortBy == 'idLivraison' and sortDir == 'asc' ? 'desc' : 'asc'})}" 
                                   class="text-decoration-none text-dark">
                                    ID Livraison
                                    <i th:if="${sortBy == 'idLivraison'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                                </a>
                            </th>
                            <th>
                                <a th:href="@{/livraison/liste(idCommande=${filterIdCommande}, type=${filterType}, startDate=${filterStartDate}, endDate=${filterEndDate}, sortBy='idCommande', sortDir=${sortBy == 'idCommande' and sortDir == 'asc' ? 'desc' : 'asc'})}" 
                                   class="text-decoration-none text-dark">
                                    Commande
                                    <i th:if="${sortBy == 'idCommande'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                                </a>
                            </th>
                            <th>Type</th>
                            <th>Partenaire</th>
                            <th>
                                <a th:href="@{/livraison/liste(idCommande=${filterIdCommande}, type=${filterType}, startDate=${filterStartDate}, endDate=${filterEndDate}, sortBy='date', sortDir=${sortBy == 'date' and sortDir == 'asc' ? 'desc' : 'asc'})}" 
                                   class="text-decoration-none text-dark">
                                    Date Livraison
                                    <i th:if="${sortBy == 'date'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                                </a>
                            </th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${livraisons == null or #lists.isEmpty(livraisons)}">
                            <td colspan="6" class="text-center">Aucune livraison disponible</td>
                        </tr>
                        <tr th:each="liv : ${livraisons}">
                            <td th:text="${liv.idLivraison}"></td>
                            <td>
                                <a th:href="@{/commande/liste}" th:text="'Commande ' + ${commandeIds[liv.idLivraison]}"></a>
                            </td>
                            <td>
                                <span th:if="${livraisonTypes[liv.idLivraison] == 'client'}" class="badge bg-primary">Client</span>
                                <span th:if="${livraisonTypes[liv.idLivraison] == 'fournisseur'}" class="badge bg-info">Fournisseur</span>
                            </td>
                            <td th:text="${partenaireNames[liv.idLivraison] != null ? partenaireNames[liv.idLivraison] : '-'}"></td>
                            <td>
                                <i class="bi bi-truck text-success"></i>
                                <span th:text="${liv.date != null ? #temporals.format(liv.date, 'dd/MM/yyyy HH:mm') : '-'}"></span>
                            </td>
                            <td>
                                <a th:href="@{/commande/liste(idCommande=${commandeIds[liv.idLivraison]})}" 
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye"></i> Voir Commande
                                </a>
                                <button type="button" class="btn btn-sm btn-outline-success" 
                                        data-bs-toggle="modal" 
                                        data-bs-target="#livraisonModal"
                                        th:onclick="'openLivraisonModal(' + ${liv.idLivraison} + ', ' + ${commandeIds[liv.idLivraison]} + ')'">
                                    <i class="bi bi-truck"></i> Livrer
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Livraison Modal -->
    <div class="modal fade" id="livraisonModal" tabindex="-1" aria-labelledby="livraisonModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="livraisonModalLabel">Effectuer la Livraison</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="livraisonForm" th:action="@{/commande/livrer/{id}}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="modalIdDepot" class="form-label">Dépôt de Livraison <span class="text-danger">*</span></label>
                            <select id="modalIdDepot" name="idDepot" class="form-select" required>
                                <option value="">-- Sélectionner un dépôt --</option>
                                <option th:each="depot : ${depots}" 
                                        th:value="${depot.idDepot}" 
                                        th:text="${depot.nom}">
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="modalDateLivraison" class="form-label">Date de Livraison <span class="text-danger">*</span></label>
                            <input type="datetime-local" 
                                   id="modalDateLivraison" 
                                   name="dateLivraison" 
                                   class="form-control" 
                                   required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="bi bi-x-circle"></i> Annuler
                        </button>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-truck"></i> Livrer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function openLivraisonModal(idLivraison, idCommande) {
            // Set the form action with the correct command ID
            const form = document.getElementById('livraisonForm');
            form.action = '/commande/livrer/' + idCommande;
            
            // Set default date to now
            const now = new Date();
            const dateString = now.toISOString().slice(0, 16);
            document.getElementById('modalDateLivraison').value = dateString;
            
            // Reset depot selection
            document.getElementById('modalIdDepot').value = '';
        }
    </script>
</section>
